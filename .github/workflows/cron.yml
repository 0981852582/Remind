name: Daily Remind Trigger

on:
  schedule:
    # 20:00 UTC tương đương với 03:00 sáng giờ Việt Nam (UTC+7)
    - cron: '0 20 * * *' 
  workflow_dispatch: # Cho phép bạn bấm chạy thử bằng tay

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Kích hoạt API gửi mail Remind
        # THAY ĐƯỜNG LINK VERCEL CỦA BẠN VÀO BÊN DƯỚI
        run: curl -X GET https://remind-lac.vercel.app/api/trigger-remind
